<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maat</title>
  <meta name="description" content="Maat: A simple, accurate metronome that runs in your browser.">
  <script>
    // Apply the saved theme before the page draws, so it never flashes the wrong colours.
    try {
      var savedTheme = localStorage.getItem('metronome-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="metronome">
    <header class="top">
      <h1 class="title">Maat</h1>
      <button type="button" id="theme-toggle" class="theme-toggle">
        <svg id="theme-icon" class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
        <span id="theme-label">Auto</span>
      </button>
    </header>

    <!-- The pendulum: the weight slides up for slower tempos, like a real one -->
    <svg class="pendulum" viewBox="0 0 200 260" aria-hidden="true">
      <path class="case" d="M40 250 L160 250 L124 16 L76 16 Z"/>
      <path class="face" d="M64 226 L136 226 L117 32 L83 32 Z"/>
      <g class="ticks">
        <line x1="93" y1="50"  x2="107" y2="50"/>
        <line x1="95" y1="70"  x2="105" y2="70"/>
        <line x1="93" y1="90"  x2="107" y2="90"/>
        <line x1="95" y1="110" x2="105" y2="110"/>
        <line x1="93" y1="130" x2="107" y2="130"/>
        <line x1="95" y1="150" x2="105" y2="150"/>
        <line x1="93" y1="170" x2="107" y2="170"/>
        <line x1="95" y1="190" x2="105" y2="190"/>
        <line x1="93" y1="210" x2="107" y2="210"/>
      </g>
      <g id="arm" class="arm resting">
        <line class="rod" x1="100" y1="235" x2="100" y2="10"/>
        <g id="weight" class="weight">
          <path d="M-12 -10 L12 -10 L8 10 L-8 10 Z"/>
        </g>
      </g>
      <circle class="pivot" cx="100" cy="235" r="6"/>
      <rect class="base" x="30" y="246" width="140" height="12" rx="3"/>
    </svg>

    <section class="readout">
      <p class="bpm-line">
        <output id="bpm-value" class="bpm" for="bpm-slider">100</output>
        <span class="unit">bpm</span>
      </p>
      <p id="tempo-name" class="tempo-name">Andante</p>
    </section>

    <div class="tempo-row">
      <button type="button" class="round" id="slower" aria-label="Slower">−</button>
      <input type="range" id="bpm-slider" min="30" max="250" value="100" aria-label="Tempo in beats per minute">
      <button type="button" class="round" id="faster" aria-label="Faster">+</button>
    </div>

    <div class="beats-block">
      <div id="beats" class="beats" role="group" aria-label="Beats in the bar"></div>
      <p class="hint">Tap a beat to make it accented, normal or silent.</p>
    </div>

    <div class="actions">
      <button type="button" id="toggle" class="primary" aria-pressed="false">Start</button>
      <button type="button" id="tap" class="secondary">Tap tempo</button>
    </div>

    <div class="settings">
      <div class="field field-stacked">
        <span class="field-label" id="groove-label">Drum groove</span>
        <p class="groove-about" id="groove-name">Metronome click only</p>
        <!-- Filled in by script.js from the GROOVES list -->
        <div id="grooves" class="grooves" role="radiogroup" aria-labelledby="groove-label"></div>
        <div class="groove-extras">
          <label class="check" id="groove-click-row" hidden>
            <input type="checkbox" id="groove-click">
            Play the click with the groove
          </label>
          <button type="button" id="groove-tempo" class="text-button" hidden></button>
        </div>
      </div>

      <div class="field">
        <span class="field-label" id="beats-label">Beats per bar</span>
        <div class="stepper" role="group" aria-labelledby="beats-label">
          <button type="button" class="round small" id="fewer-beats" aria-label="Fewer beats">−</button>
          <output id="beats-value" class="stepper-value">4</output>
          <button type="button" class="round small" id="more-beats" aria-label="More beats">+</button>
        </div>
      </div>

      <div class="field field-stacked">
        <div class="field-head">
          <span class="field-label" id="sub-label">Subdivision</span>
          <span class="sub-name" id="sub-name">Quarter notes</span>
        </div>
        <!-- Filled in by script.js: one tile with a note icon per rhythm -->
        <div id="subdivisions" class="subdivisions" role="radiogroup" aria-labelledby="sub-label"></div>
      </div>

      <div class="field">
        <label class="field-label" for="volume">Volume</label>
        <input type="range" id="volume" min="0" max="100" value="80">
      </div>
    </div>

    <p class="keys">
      <kbd>Space</kbd> starts and stops, <kbd>↑</kbd> <kbd>↓</kbd> change the tempo, <kbd>T</kbd> taps it.
    </p>
  </main>

  <script src="script.js"></script>
  <!-- 100% privacy-first analytics -->
  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
</body>
</html>
